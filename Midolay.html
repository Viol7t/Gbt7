<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Happy Birthday Jana</title>
    <link rel='stylesheet' href='stylesMi.css'>
</head>
<body>

    <div class="page-wrap">

        <div id="Birthday-card">

            <img src="jpcbild.jpg" alt="Mido" class="sticker sticker-1" id="jpc-image">
            <img src="jeffbild.jpg" alt="Mido" class="sticker sticker-2" id="jeff-image">

            <div class="card-text">
                <h1>Liebe Jana</h1>
                <p>
                    Happy Birthday! Ich hoffe, du hast einen schönen Tag.<br><br>
                    Ich bin sehr froh, dass wir uns kennengelernt haben.<br><br>
                    Es ist immer schön, in der Astralebene uns gegenseitig zu begrapschen,
                    und ich hoffe sehr, dass wir das noch sehr lange so machen können.
                </p>
                <p class="signature">– Amelie Erdbeer</p>
            </div>
        </div>

        <a href="index.html" class="button">Zurück</a>

    </div>

    <audio id="jpc-sound" src="jetpack-cat-taunt.mp3"></audio>
    <audio id="jeff-sound" src="singing-jeff.mp3"></audio>

    <script>
        const sounds = [
            document.getElementById('jpc-sound'),
            document.getElementById('jeff-sound')
        ];

        function toggleSound(sound) {
            // Alle anderen Sounds stoppen
            sounds.forEach(function(s) {
                if (s !== sound) {
                    s.pause();
                    s.currentTime = 0;
                }
            });

            // Diesen Sound abspielen oder pausieren
            if (sound.paused) {
                sound.play();
            } else {
                sound.pause();
                sound.currentTime = 0;
            }
        }

        document.getElementById('jpc-image').addEventListener('click', function() {
            toggleSound(document.getElementById('jpc-sound'));
        });

        document.getElementById('jeff-image').addEventListener('click', function() {
            toggleSound(document.getElementById('jeff-sound'));
        });
    </script>

</body>
</html>
